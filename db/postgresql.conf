# RDB Join Lab: PostgreSQL arm configuration.
# Each setting mirrors the *intent* of a db/my.cnf (MySQL) setting; the mapping is
# recorded here so the two arms can be audited side by side.

listen_addresses = '*'

# -- Buffer pool parity ---------------------------------------------------------
# my.cnf: innodb_buffer_pool_size = 3G (hot set held by the DB's own cache).
# PostgreSQL idiom would be a smaller shared_buffers plus OS page cache, but the
# warm-state gate in warmup-pg.sh measures the DB's own cache hit ratio, so the
# hot set must live in shared_buffers for the gate to mean the same thing it
# means on MySQL. 3GB inside a 4GB container mem_limit, same headroom as MySQL.
shared_buffers = 3GB
effective_cache_size = 3GB

# pg_prewarm: manual prewarm calls need only the extension, but preloading also
# enables autoprewarm if a future round wants dump/load semantics closer to
# InnoDB's buffer-pool dump/load.
shared_preload_libraries = 'pg_prewarm'

# -- Planner determinism parity -------------------------------------------------
# my.cnf: innodb_stats_auto_recalc = 0 (plans change only at explicit ANALYZE).
# autovacuum's auto-analyze is the PG mechanism that silently refreshes
# statistics mid-campaign, so it is off; seed-pg.sh and warmup-pg.sh run
# ANALYZE explicitly. The workload is read-only during measurement, so vacuum
# itself is not needed between reseeds.
autovacuum = off

# my.cnf: innodb_stats_persistent_sample_pages = 200 (tight cardinality
# estimates so plans do not flip mid-campaign). Same intent via a raised
# statistics target.
default_statistics_target = 500

# -- Warm/cold asymmetry parity -------------------------------------------------
# my.cnf: innodb_adaptive_hash_index = OFF. The PG analogue of an engine-side
# optimization that fires on first access and not on later ones is JIT
# compilation; off for a reproducible access profile.
jit = off

# -- Logging parity -------------------------------------------------------------
# my.cnf: slow_query_log with long_query_time = 2.
log_min_duration_statement = 2000

# -- Write-path noise parity ----------------------------------------------------
# my.cnf: skip-log-bin (no replication log; the seeder otherwise writes ~1GB of
# it per reseed). wal_level=minimal is the PG equivalent for a single node.
wal_level = minimal
max_wal_senders = 0

# Bulk seeding without checkpoint storms; irrelevant during read-only measurement.
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# -- Diagnostics ----------------------------------------------------------------
track_io_timing = on
