server:
  port: 8080
  tomcat:
    threads:
      max: 50
    accept-count: 100

spring:
  datasource:
    # rewriteBatchedStatements removed: this harness uses individual SELECT queries,
    # not JDBC batch INSERTs. Including the flag would mask per-query wire count in
    # Hibernate statistics and confound N+1 measurements.
    url: jdbc:mysql://lab-mysql:3306/lab
    username: root
    password: labpass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: lab-pool
      # connectionTimeout capped at 5s: if HikariCP cannot acquire a connection within
      # 5s the request fails fast rather than queuing indefinitely. This makes pool
      # saturation visible as request failures (measurable) rather than queue growth
      # (latency that looks like app-level slowness). Scenario L uses this for knee detection.
      connection-timeout: 5000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: true
        # default_batch_fetch_size is disabled by default (-1).
        # Set env HIBERNATE_DEFAULT_BATCH_FETCH_SIZE to a positive integer
        # (e.g. 100) to enable automatic IN-batch fetching for LAZY associations.
        # Hibernate treats absent/null as disabled; we wire -1 which acts as
        # "unset" for Hibernate 6.x (effectively disabling it).
        # If -1 causes issues, set the env to 0 or leave the env unset entirely.
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:-1}
        # Note: Spring Boot property syntax: ${VAR:default} for empty-string-sensitive default
        # The :-1 above works when HIBERNATE_DEFAULT_BATCH_FETCH_SIZE is "-1" (set by compose)

lab:
  c:
    # candidateCap default is 50000 (startup-safe sentinel).
    # IMPORTANT: every Scenario C measurement cell MUST override this explicitly via
    # LAB_C_CANDIDATE_CAP env var in run-cell.sh. The sentinel value of 50000 must
    # NOT be used for measurement — it must appear in the cell metadata as an explicit
    # decision, not as a silent default. See PREREGISTRATION.md §5 for the sweep plan.
    candidate-cap: ${LAB_C_CANDIDATE_CAP:50000}
